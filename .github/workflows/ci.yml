name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 测试全部用 FakeLLM 离线跑，不需要任何 API key。
      # addopts 已在 pyproject.toml 里设好（-p no:cacheprovider --basetemp=bt_all）。
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 前端是原生 HTML/JS（web/dist/ 就是源码，无构建步骤），这里装的只是测试用的 jsdom。
      - name: Install test dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run frontend smoke tests
        working-directory: web
        run: npm test
