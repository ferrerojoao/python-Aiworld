name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 静态检查放在测试前面：它更快，能先把 import 顺序/未用变量这类问题挡回去。
      # 规则集与 ignore 全在 pyproject.toml 的 [tool.ruff] 里，CI 不再另写一份。
      # 注：只跑 check，不跑 `ruff format`——格式化会重排 50+ 个文件，是另一次
      # 独立决策，不该混进 lint 闸门。
      - name: Lint (ruff)
        run: python -m ruff check --output-format=github

      # 测试全部用 FakeLLM 离线跑，不需要任何 API key。
      # addopts 已在 pyproject.toml 里设好（-p no:cacheprovider --basetemp=bt_all）。
      # 覆盖率闸门（fail_under = 90）也写在 pyproject.toml 的 [tool.coverage.report]。
      - name: Run tests
        run: python -m pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 前端是原生 HTML/JS（web/dist/ 就是源码，无构建步骤），这里装的只是测试用的 jsdom。
      - name: Install test dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run frontend smoke tests
        working-directory: web
        run: npm test
